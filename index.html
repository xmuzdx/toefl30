<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>托福30天 · 学习控制台</title>

<style>
:root{--bg:#0c1827;--panel:#12263a;--panel2:#17334a;--text:#f5f0e6;--muted:#9db2c2;--mint:#8fd5c3;--amber:#f3b562;--coral:#e67f68;--blue:#75a9ff;--line:#28445a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(12,24,39,.96);backdrop-filter:blur(8px);padding:10px 16px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;color:var(--amber);flex:1}
#sync{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
#sync.ok{color:var(--mint)}#sync.err{color:var(--coral)}
main{max-width:760px;margin:0 auto;padding:14px 14px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 8px}
.eyebrow{color:var(--amber);font-size:13px;font-weight:600}
.title{font-size:22px;font-weight:700;margin:2px 0}
.muted{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.daynav{display:flex;gap:8px;margin-top:10px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--mint);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.primary,.btn.primary{background:var(--mint);color:#10232c}
button.amber{background:var(--amber);color:#241b11}
button.ghost{background:transparent;color:var(--muted);padding:6px 8px}
button:disabled{opacity:.5}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--mint);flex:none}
.task label{flex:1}.task small{display:block;color:var(--muted);font-size:12px}
.task.done label{color:var(--muted);text-decoration:line-through}
.steps{white-space:pre-wrap;font-size:14px;margin:0}
.mat{font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.mat:first-child{border-top:0}.mat code{display:block;color:var(--muted);font-size:12px;word-break:break-all;font-family:inherit}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;font:inherit;font-size:16px;color:var(--text);background:#0e2030;border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.field{margin:8px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid30{display:grid;grid-template-columns:1fr;gap:8px}
.dayitem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dayitem.today{border-color:var(--amber)}
.dayitem .n{font-weight:700;width:42px;color:var(--amber)}
.dayitem .t{flex:1;font-size:14px}.dayitem .t small{display:block;color:var(--muted);font-size:12px}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--panel2);color:var(--mint);white-space:nowrap}
.pill.full{background:var(--mint);color:#10232c}.pill.live{background:#3a2a14;color:var(--amber)}
.bar{height:8px;background:#0a1420;border-radius:99px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--mint)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#0a1420;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:transparent;border-radius:0;color:var(--muted);padding:10px 0 12px;font-size:13px;font-weight:600}
nav button.on{color:var(--mint)}
nav button .ic{display:block;font-size:19px;line-height:1.2}
.log{border-top:1px solid var(--line);padding:8px 0;font-size:14px}.log:first-child{border-top:0}
.log b{color:var(--mint)}
.timer{font-size:28px;font-weight:700;color:var(--amber);min-width:96px}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--mint);color:#10232c;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
a{color:var(--mint)}
</style>
</head>

function buildTasks(day){
  const [title,focus,,live] = META[day-1];
  if(day===1) return [
    {label:"不查答案完成一套 2026 新题型真题",minutes:90,kind:"基线"},
    {label:"录一段 2 分钟英文自我介绍，保存原始音频",minutes:10,kind:"口语"},
    {label:"写一篇 10 分钟学术讨论，记录原始版本",minutes:15,kind:"写作"},
    {label:"统计四科正确率、卡顿点和时间压力",minutes:20,kind:"复盘"}];
  let tasks;
  if(MOCK_DAYS.has(day)){
    tasks = [
      {label:"计时完成 "+title.split(" + ")[0],minutes:100,kind:"模考"},
      {label:"口语录音：听后复述 4 题 + Interview 4 题",minutes:20,kind:"口语"},
      {label:"写作抽查：组句 5 题 + 学术讨论 1 篇",minutes:20,kind:"写作"},
      {label:"复盘：只写三条最值得修复的错误",minutes:15,kind:"复盘"}];
  } else {
    const main = ["阅读","听力","口语","写作"][day%4];
    tasks = [
      {label:main+"主线训练："+focus,minutes:35,kind:main},
      {label:"听力精听 1 组：先盲听，再看原文核对",minutes:30,kind:"听力"},
      {label:"口语：Listen & Repeat 4 题 + Interview 4 题并录音",minutes:25,kind:"口语"},

  return tasks;
}

/* ---------- 数据：扁平化 + 按字段“后写入者胜” ---------- */
function flatten(doc){
  const f = {};
  if(doc.start_date!==undefined) f["start_date"]=doc.start_date;
  if(doc.target_band!==undefined) f["target_band"]=doc.target_band;
  for(const [d,arr] of Object.entries(doc.completed||{})) (arr||[]).forEach((v,i)=>{f[`completed.${d}.${i}`]=!!v});
  for(const [d,t] of Object.entries(doc.notes||{})) f[`notes.${d}`]=t;
  for(const l of (doc.speaking_logs||[])) if(l&&l.id) f[`log.${l.id}`]=l;
  for(const [id,s] of Object.entries(doc.scores||{})) f[`score.${id}`]=s;
  return f;
}
function unflatten(f, ts){
  const doc = {v:1,start_date:"2026-10-08",target_band:5.0,completed:{},notes:{},speaking_logs:[],scores:{},_ts:ts||{}};
  const logs = [];
  for(const [k,v] of Object.entries(f)){
    const p = k.split(".");
    if(k==="start_date"||k==="target_band") doc[k]=v;
    else if(p[0]==="completed"){ const a = doc.completed[p[1]] || (doc.completed[p[1]]=[]); a[+p[2]]=v; }
    else if(p[0]==="notes") doc.notes[p[1]]=v;
    else if(p[0]==="log") logs.push(v);
    else if(p[0]==="score") doc.scores[p.slice(1).join(".")]=v;
  }
  for(const a of Object.values(doc.completed)) for(let i=0;i<a.length;i++) if(a[i]===undefined) a[i]=false;
  logs.sort((x,y)=>(x.ts||0)-(y.ts||0)); doc.speaking_logs = logs;
  return doc;
}
function merge(a, b){
  const fa=flatten(a), fb=flatten(b), ta=a._ts||{}, tb=b._ts||{};
  const out={}, ts={};
  for(const k of new Set([...Object.keys(fa),...Object.keys(fb)])){
    const inA = k in fa, inB = k in fb, sa = ta[k]||0, sb = tb[k]||0;
    let v, s;
    if(inA && !inB){v=fa[k];s=sa} else if(inB && !inA){v=fb[k];s=sb}
    else if(sa>sb){v=fa[k];s=sa} else if(sb>sa){v=fb[k];s=sb}
    else { s=sa; const x=fa[k], y=fb[k];
      if(typeof x==="boolean") v = x||y; else v = (JSON.stringify(x)>=JSON.stringify(y)) ? x : y; }
    out[k]=v; if(s) ts[k]=s;
  }
  return unflatten(out, ts);
}
function sameDoc(a,b){ return JSON.stringify(canon(a))===JSON.stringify(canon(b)); }
function canon(d){ const f=flatten(d), o={}; for(const k of Object.keys(f).sort()) o[k]=[f[k], (d._ts||{})[k]||0]; return o; }

let state = loadLocal();
function loadLocal(){ try{ const s = JSON.parse(localStorage.getItem(LS_STATE)); if(s && s.v) return s; }catch(e){} return merge(SEED,{}); }
function saveLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); }catch(e){} }
function setField(path, value){
  const f = flatten(state); f[path]=value; state._ts = state._ts||{}; state._ts[path]=Date.now();
  state = unflatten(f, state._ts); saveLocal(); scheduleSync();
}

/* ---------- 同步（textdb.dev，一个同步码 = 一份共享进度） ---------- */
function getSyncId(){
  const m = location.hash.match(/sync=([A-Za-z0-9_-]{16,80})/);
  if(m){ localStorage.setItem(LS_SYNC, m[1]); return m[1]; }
  const ls = localStorage.getItem(LS_SYNC);
  if(ls) return ls;
  if(window.PRESET_SYNC){ localStorage.setItem(LS_SYNC, window.PRESET_SYNC); return window.PRESET_SYNC; }
  return "";
}
let syncId = getSyncId(), syncTimer=null, syncing=false, lastSync=0, syncErr="";
function setSyncLabel(){
  const el = document.getElementById("sync");
  if(!syncId){ el.textContent="未设置同步码"; el.className="err"; return; }
  if(syncing){ el.textContent="同步中…"; el.className=""; return; }
  if(syncErr){ el.textContent="离线 · 已存本机"; el.className="err"; return; }
  if(lastSync){ const d=new Date(lastSync); el.textContent="已同步 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); el.className="ok"; }
}
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 800); }
async function fetchRemote(){
  const r = await fetch(STORE+encodeURIComponent(syncId)+"?t="+Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const t = (await r.text()).trim();
  if(!t) return {};
  const j = JSON.parse(t); return (j && typeof j==="object") ? j : {};
}
async function pushRemote(doc){
  const r = await fetch(STORE+encodeURIComponent(syncId), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(doc)});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function syncNow(){
  if(!syncId || syncing) return;
  syncing=true; setSyncLabel();
  try{
    const remote = await fetchRemote();
    const merged = merge(state, remote);
    const changedLocal = !sameDoc(merged, state);
    if(!sameDoc(merged, remote)) await pushRemote(merged);
    state = merged; saveLocal(); lastSync=Date.now(); syncErr="";
    if(changedLocal) render();
  }catch(e){ syncErr=String(e); }
  syncing=false; setSyncLabel();
}
setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); }, 30000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") syncNow(); });
window.addEventListener("online", syncNow);

/* ---------- 计算 ---------- */
const pad = n=>String(n).padStart(2,"0");
function parseDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function currentDay(){ const s=parseDate(state.start_date||"2026-10-08"), t=parseDate(todayStr()); return Math.min(30, Math.max(1, Math.round((t-s)/86400000)+1)); }
function dayDate(day){ const s=parseDate(state.start_date||"2026-10-08"); s.setDate(s.getDate()+day-1); return s; }
function completedFor(day){ const n=buildTasks(day).length, raw=(state.completed||{})[String(day)]||[]; return Array.from({length:n},(_,i)=>!!raw[i]); }
function dayProgress(day){ const v=completedFor(day); return [v.filter(Boolean).length, v.length]; }
function totalProgress(){ let d=0,t=0; for(let i=1;i<=30;i++){ const [a,b]=dayProgress(i); d+=a; t+=b; } return [d,t]; }
function streak(){ let s=0; for(let d=currentDay(); d>=1; d--){ const [a,b]=dayProgress(d); if(b&&a===b) s++; else break; } return s; }
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); setTimeout(()=>el.classList.remove("on"),1500); }

}

function startTimer(min){ timerEnd=Date.now()+min*60000; clearInterval(timerIv); timerIv=setInterval(tickTimer,1000); tickTimer(); }
function stopTimer(){ timerEnd=0; clearInterval(timerIv); tickTimer(); }
function tickTimer(){ const el=document.getElementById("timer"); if(!el) return; if(!timerEnd){ el.textContent="25:00"; return; } const s=Math.max(0,Math.round((timerEnd-Date.now())/1000)); el.textContent=pad(Math.floor(s/60))+":"+pad(s%60); if(s<=0){ stopTimer(); alert("这一段完成了。花 2 分钟写下一个可复测的发现。"); } }

    setField(`log.${item.id}`, item); toast("已保存口语记录"); render();
  };
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(!confirm("删除这条记录？")) return; const l=(state.speaking_logs||[]).find(x=>x.id===b.dataset.del); if(l){ setField(`log.${l.id}`, Object.assign({},l,{deleted:true})); render(); } });
}
function val(id){ return document.getElementById(id).value.trim(); }
function renderScore(v){
  const target=+state.target_band||5;
  const list=Object.entries(state.scores||{}).map(([id,s])=>Object.assign({id},s)).filter(s=>!s.deleted).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const avg = s=>{ const xs=["reading","listening","speaking","writing"].map(k=>parseFloat(s[k])).filter(x=>!isNaN(x)); return xs.length? (Math.round(xs.reduce((a,b)=>a+b,0)/xs.length*2)/2).toFixed(1):"-"; };
  v.innerHTML = `<div class="card"><h2>成绩记录</h2><div class="muted">新托福 1–6 分制，目标总分 <b style="color:var(--amber)">${target.toFixed(1)}</b>。模考/周测后记一笔，看趋势。</div></div>
  <div class="card"><h2>新增一次成绩</h2>
   <div class="row"><div class="field"><label>日期</label><input type="date" id="sd" value="${todayStr()}"></div><div class="field"><label>类型</label><select id="sk"><option>基线</option><option>周测</option><option>模考</option><option>专项</option><option>正式考试</option></select></div></div>
   <div class="field"><label>套题 / 备注</label><input type="text" id="sn" placeholder="如：2026-01-21_A卷"></div>
   <div class="row">${[["reading","阅读"],["listening","听力"],["speaking","口语"],["writing","写作"]].map(([k,n])=>`<div class="field"><label>${n}</label><input type="number" step="0.5" min="1" max="6" inputmode="decimal" id="s_${k}"></div>`).join("")}</div>
   <button class="primary" id="ssave" style="width:100%">保存成绩</button></div>
  <div class="card"><h2>历史（${list.length}）</h2>${list.length?list.map(s=>`<div class="log"><b>${esc(s.date)} · ${esc(s.kind)} · 总分 ${avg(s)}</b> <button class="ghost" data-del="${esc(s.id)}">删除</button><div class="muted">阅读 ${esc(s.reading||"-")} · 听力 ${esc(s.listening||"-")} · 口语 ${esc(s.speaking||"-")} · 写作 ${esc(s.writing||"-")} ${s.note?"· "+esc(s.note):""}</div></div>`).join(""):'<div class="muted">还没有成绩。第 1 天基线模考后先记一笔。</div>'}</div>`;
  document.getElementById("ssave").onclick=()=>{
    const s={date:val("sd"), kind:val("sk"), note:val("sn"), reading:val("s_reading"), listening:val("s_listening"), speaking:val("s_speaking"), writing:val("s_writing"), ts:Date.now()};
    if(![s.reading,s.listening,s.speaking,s.writing].some(x=>x)){ toast("至少填一科分数"); return; }
    setField(`score.S${Date.now().toString(36)}`, s); toast("已保存成绩"); render();
  };
  v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ if(!confirm("删除这条成绩？")) return; const s=(state.scores||{})[b.dataset.del]; if(s){ setField(`score.${b.dataset.del}`, Object.assign({},s,{deleted:true})); render(); } });
}
function renderSet(v){
  const link = location.href.split("#")[0] + (syncId?"#sync="+syncId:"");
  v.innerHTML = `<div class="card"><h2>计划设置</h2>
   <div class="field"><label>开始日期</label><input type="date" id="st" value="${esc(state.start_date)}"></div>
   <div class="field"><label>目标总分（1–6）</label><input type="number" step="0.5" min="1" max="6" id="tb" value="${esc(state.target_band)}" inputmode="decimal"></div>
   <button class="primary" id="saveset" style="width:100%">保存设置</button></div>
  <div class="card"><h2>多设备同步</h2>
   <div class="muted">同步码：</div><div style="word-break:break-all;font-family:ui-monospace,monospace;font-size:14px;margin:4px 0 8px">${esc(syncId||"（未设置）")}</div>
   <div class="row"><button id="copylink">复制同步链接</button><button id="syncnow">立即同步</button></div>
   <div class="muted" style="margin-top:8px">在 iPhone / iPad / 电脑上打开同一个「同步链接」，进度自动合并（每项以最后一次修改为准）。离线时先存本机，联网后自动补传。</div>
   <div class="field" style="margin-top:10px"><label>换成另一个同步码</label><input type="text" id="sid2" autocapitalize="off" autocomplete="off" placeholder="toefl30-…"></div><button id="usesid2">切换</button></div>
  <div class="card"><h2>备份</h2><div class="row"><button id="exp">导出 JSON</button><button id="imp">导入 JSON</button></div><input type="file" id="impf" accept=".json,application/json" class="hidden">
   <div class="muted" style="margin-top:8px">导入会与当前进度合并，不会覆盖更新的记录。</div></div>
  <div class="card muted">资料文件只在电脑上：D:\\BaiduNetdiskDownload\\01_每日任务_30天。电脑上的「托福30天学习控制台」也连着同一份进度。</div>`;
  document.getElementById("saveset").onclick=()=>{ const s=val("st"), b=parseFloat(val("tb")); if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||!(b>=1&&b<=6)){ toast("日期或目标分格式不对"); return; } if(s!==state.start_date) setField("start_date", s); if(b!==+state.target_band) setField("target_band", b); selDay=currentDay(); toast("已保存设置"); render(); };
  document.getElementById("copylink").onclick=async()=>{ try{ await navigator.clipboard.writeText(link); toast("已复制同步链接"); }catch(e){ prompt("复制这个链接：", link); } };
  document.getElementById("syncnow").onclick=async()=>{ await syncNow(); toast(syncErr?"同步失败，已存本机":"已同步"); render(); };
  document.getElementById("usesid2").onclick=()=>{ const s=val("sid2"); if(!/^[A-Za-z0-9_-]{16,80}$/.test(s)){ toast("同步码格式不对"); return; } syncId=s; localStorage.setItem(LS_SYNC,s); syncNow().then(render); };
  document.getElementById("exp").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"})); a.download="toefl30-progress-"+todayStr()+".json"; a.click(); };
  document.getElementById("imp").onclick=()=>document.getElementById("impf").click();
  document.getElementById("impf").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); state=merge(state,j); saveLocal(); scheduleSync(); toast("已导入并合并"); render(); }catch(err){ toast("文件格式不对"); } };
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{ view=b.dataset.v; if(view==="today") selDay=selDay||currentDay(); render(); window.scrollTo(0,0); });
render(); syncNow();
if("serviceWorker" in navigator && location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
